name: Cloud Reference checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-reference-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Retain reproducible source snapshot
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: cloud-reference-source
          path: |
            src/
            test/
            scripts/
            types/
            docs/
            examples/
            README.md
            AGENTS.md
            package.json
            manifest.json
            versions.json
            styles.css
            .gitattributes
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
